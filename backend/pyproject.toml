[project]
name = "drivemanager-backend"
version = "1.0.0"
description = "DriveManager backend and worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<2.2",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "argon2-cffi>=23.1,<26",
  "cryptography>=42",
  "itsdangerous>=2.2,<3",
  "google-api-python-client>=2.130,<3",
  "google-auth>=2.30,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "requests>=2.32,<3",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
